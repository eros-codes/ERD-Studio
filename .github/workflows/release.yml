# Builds the Windows installer and publishes a GitHub Release when you push a version tag:
#   git tag v2.3.0
#   git push origin v2.3.0
# The tag must match <version> in pom.xml (the workflow checks this).
# The app's auto-updater reads the latest release: it needs the Setup .exe and SHA256SUMS.txt.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check tag matches pom.xml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pom = ([xml](Get-Content pom.xml)).project.version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($pom -ne $tag) { throw "Tag v$tag does not match pom.xml version $pom" }

      - name: Install WiX Toolset 3 (if missing)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wix) {
              choco install wixtoolset --version 3.14.1 -y --no-progress
              $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1
            }
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build installer
        shell: cmd
        run: build-exe.bat installer

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: erd-studio-installer
          path: |
            target/installer/*.exe
            target/installer/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ERD Studio ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/installer/*.exe
            target/installer/SHA256SUMS.txt
